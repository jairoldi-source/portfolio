<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jen Airoldi</title>
<meta name="description" content="Jen Airoldi — analytics leadership, behavioral data, and AI-powered tools for civic tech and mission-driven organizations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFCFC;
    --nav-bg: #0F3D3E;
    --nav-bg-light: #BFDBD3;
    --teal: #14746F;
    --purple: #7B5088;
    --ink: #14746F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  .nav {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: var(--nav-bg);
    padding: 26px 6vw;
  }
  .nav__side {
    display: flex;
    gap: 28px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .nav__side a { color: var(--nav-bg-light); transition: color 0.15s ease; }
  .nav__side a:hover { color: #FBFCFC; }
  .nav__side a.is-current { color: var(--purple); }
  .nav__left { justify-self: start; }
  .nav__right { justify-self: end; }
  .brand {
    justify-self: center;
    font-family: 'Domine', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--bg);
  }

  .hero {
    padding: 9vh 6vw 10vh;
    max-width: 840px;
  }
  .hero h1 {
    font-family: 'Domine', serif;
    font-weight: 700;
    font-size: clamp(32px, 4.6vw, 48px);
    line-height: 1.24;
    color: var(--teal);
  }
  .hero h1 .accent { color: var(--purple); }
  .hero p {
    margin-top: 22px;
    font-size: 17px;
    line-height: 1.65;
    max-width: 620px;
    color: var(--teal);
  }

  @media (max-width: 640px) {
    .nav { grid-template-columns: 1fr; justify-items: center; row-gap: 14px; padding: 20px 6vw; }
    .nav__left, .nav__right { justify-self: center; }
    .hero { padding: 7vh 7vw 8vh; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav__side nav__left">
    <a href="/about.html">About</a>
    <a href="/notes.html">Notes</a>
  </div>
  <a class="brand" href="/">Jen Airoldi</a>
  <div class="nav__side nav__right">
    <a href="/projects.html" class="is-current">Projects</a>
    <a href="/contact.html">Contact</a>
  </div>
</nav>

<header class="hero">
  <h1>Moves organizations from counting to <span class="accent">deciding</span>.</h1>
  <p>Fifteen years on the behavioral data side of what drives people to engage, stay, go deeper, or walk away. Now I want to apply it somewhere the answer matters more.</p>
</header>

</body>
</html>
